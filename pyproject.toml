[project]
name = "video-qc-utilities"
version = "0.2.0"
description = "Modular URL redaction, tracking, and editorial video QC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "rapidocr-onnxruntime>=1.4.4",
    "rich>=15.0.0",
    "tldextract>=5.4.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
video-qc = "video_qc.cli:app"
video-qc-legacy = "video_qc.legacy_cli:app"
video-qc-desktop = "video_qc.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_qc"]

[tool.hatch.build.targets.sdist]
exclude = ["demos", "tests/fixtures/video"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: uses FFmpeg and real media", "ocr: runs bundled ONNX models", "gui: runs Qt offscreen"]

[tool.ruff]
line-length = 110

[project.optional-dependencies]
gui = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
