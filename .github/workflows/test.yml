name: tests
on: [push, pull_request]
jobs:
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: brew install cmake ffmpeg
      - uses: actions/cache@v4
        with:
          path: .native/opencv
          key: opencv-4.12-${{ runner.os }}-${{ runner.arch }}-minimal
      - run: bash scripts/build_native_deps.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked -- --test-threads=1
      - run: cargo build --release --locked
      - run: |
          if target/release/video-qc doctor >/dev/null 2>&1; then
            URL_GUARD_ENGINE="$PWD/target/release/video-qc" swift test --package-path macos
          else
            swift test --package-path macos
          fi
      - run: bash scripts/build_macos.sh
  compatibility:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
